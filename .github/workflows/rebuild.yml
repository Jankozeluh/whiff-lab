# Once a month: is there a new Retrosheet release on the Chadwick Bureau's mirror (branch `official`), or a new
# version of the Lahman database on CRAN? If so, fetch only what changed, rebuild everything (parse, test the
# models, export, the Rookie Report, the notes and the site) and commit the new results here. Retrosheet
# publishes a new season around December, Lahman early in the year, so most months this stops after two
# small requests. Run it by hand from the Actions tab with "force" to rebuild anyway.
name: rebuild
on:
  schedule:
    - cron: "17 5 15 * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if Retrosheet has not changed
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Has Retrosheet or the Lahman database published anything new?
        id: check
        run: |
          latest=$(git ls-remote https://github.com/chadwickbureau/retrosheet.git refs/heads/official | cut -f1)
          lahman=$(curl -fsS https://cran.r-project.org/web/packages/Lahman/index.html | grep -o 'Lahman_[0-9.-]*\.tar\.gz' | head -1)
          built=$(python3 -c "import json; print(json.load(open('results/source.json'))['commit'])")
          built_lahman=$(python3 -c "import json; print(json.load(open('results/source.json')).get('lahman', ''))")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "lahman=$lahman" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$built" ] || { [ -n "$lahman" ] && [ "$lahman" != "$built_lahman" ]; } || [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Rebuilding: Retrosheet $built -> $latest, Lahman $built_lahman -> $lahman"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Nothing new (Retrosheet at $latest, $lahman)."
          fi
      - if: steps.check.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/retrosheet
          key: retrosheet-${{ steps.check.outputs.latest }}
          restore-keys: retrosheet-
      - if: steps.check.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - if: steps.check.outputs.run == 'true'
        run: uv sync --locked
      - if: steps.check.outputs.run == 'true'
        run: uv run whiff-lab all
      - if: steps.check.outputs.run == 'true'
        name: The whole-season test, now that the data is here
        run: uv run pytest -q
      - if: steps.check.outputs.run == 'true'
        name: Commit the new results
        run: |
          git config user.name "whiff-lab rebuild"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results site lab-notes
          if git diff --cached --quiet; then echo "No change in the results."; exit 0; fi
          git commit -m "Rebuild from Retrosheet's release ${{ steps.check.outputs.latest }} and ${{ steps.check.outputs.lahman }}."
          git push
