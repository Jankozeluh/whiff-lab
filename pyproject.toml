[project]
name = "whiff-lab"
version = "0.1.0"
description = "Open baseball models built only from free, openly licensed data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "markdown>=3.7",
]

[project.scripts]
whiff-lab = "whiff_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whiff_lab"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/whiff_lab/site.py" = ["E501"]  # the page template is HTML

[tool.pytest.ini_options]
testpaths = ["tests"]
